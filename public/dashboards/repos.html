    <section id="dashboard-repos" class="page dashboard-view">
      <header class="header">
        <div>
          <p class="eyebrow" data-brand-mark>{{branding.author}} / {{branding.product}}</p>
          <h1>Repos</h1>
          <p id="reposStatus" class="status">Loading…</p>
        </div>
      </header>

      <section class="filters" aria-label="Date filters">
        <label class="filter-field">
          <span>Start date</span>
          <input id="reposStartDate" type="date" />
        </label>
        <label class="filter-field">
          <span>End date</span>
          <input id="reposEndDate" type="date" />
        </label>
        <button id="reposClearFiltersBtn" type="button" class="secondary-btn">
          Clear dates
        </button>
      </section>

      <section id="reposEmptyState" class="empty hidden">
        <p>No local data yet. Click <strong>Refresh data</strong> to load from Azure DevOps and SonarCloud.</p>
      </section>

      <section id="reposTableCard" class="chart-card repos-table-card hidden">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Repository</th>
                <th class="num">Pull requests</th>
                <th class="num">Lines of code</th>
                <th class="num">Coverage</th>
              </tr>
            </thead>
            <tbody id="reposBody">
              <tr>
                <td colspan="4" class="table-empty">Loading…</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <p id="reposError" class="error hidden"></p>
    </section>
