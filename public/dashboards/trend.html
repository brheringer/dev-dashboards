    <section id="dashboard-trend" class="page dashboard-view">
      <header class="header">
        <div>
          <p class="eyebrow" data-brand-mark>{{branding.author}} / {{branding.product}}</p>
          <h1>Trend</h1>
          <p id="trendStatus" class="status">Loading…</p>
        </div>
      </header>

      <section class="filters" aria-label="Trend filters">
        <label class="filter-field">
          <span>Y axis</span>
          <select id="trendMetric">
            <option value="storyPoints">Story points sum</option>
            <option value="userStories">User stories count</option>
            <option value="techDebts">Tech debt count</option>
            <option value="sprintBugs">Sprint bug count</option>
            <option value="usBugs">US bug count</option>
            <option value="pullRequests">Pull request count</option>
            <option value="linesOfCode">Lines of code sum</option>
            <option value="coverage">Coverage</option>
          </select>
        </label>
        <label class="filter-field">
          <span>Start date</span>
          <input id="trendStartDate" type="date" />
        </label>
        <label class="filter-field">
          <span>End date</span>
          <input id="trendEndDate" type="date" />
        </label>
        <button id="trendClearFiltersBtn" type="button" class="secondary-btn">
          Clear dates
        </button>
      </section>

      <section id="trendEmptyState" class="empty hidden">
        <p>No local data yet. Click <strong>Refresh data</strong> to load from Azure DevOps and SonarCloud.</p>
      </section>

      <section id="trendResults" class="trend-results hidden">
        <section id="trendChartCard" class="chart-card">
          <div class="chart-card-head">
            <div>
              <h2 id="trendMetricTitle">Story points sum</h2>
              <p id="trendMetricHint" class="metric-hint"></p>
            </div>
            <p id="trendMetricValue" class="value">—</p>
          </div>
          <div id="trendChart" class="trend-chart" aria-label="Trend line chart"></div>
        </section>
        <div class="metrics-row metrics-row-2">
          <article class="metric">
            <h2>1st derivative</h2>
            <p id="trendFirstDerivative" class="value">—</p>
            <p class="metric-hint">Average daily change of the curve (speed)</p>
          </article>
          <article class="metric">
            <h2>2nd derivative</h2>
            <p id="trendSecondDerivative" class="value">—</p>
            <p class="metric-hint">Acceleration of the fitted curve</p>
          </article>
        </div>
      </section>

      <p id="trendError" class="error hidden"></p>
    </section>
